<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>催眠入眠频率发生器 | 助眠冥想</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a14;
  color: #c8c8d8;
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: background 3s ease;
  -webkit-user-select: none;
  user-select: none;
}
body.sleeping { background: #050508; }
.star {
  position: fixed;
  width: 2px; height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0;
  animation: twinkle var(--dur) ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.1; }
  50% { opacity: var(--max); }
}
.container {
  text-align: center;
  z-index: 10;
  max-width: 500px;
  padding: 40px 30px;
}
h1 {
  font-size: 1.8em;
  font-weight: 300;
  letter-spacing: 0.3em;
  margin-bottom: 10px;
  color: #e0e0f0;
  text-shadow: 0 0 30px rgba(100,120,255,0.3);
}
.subtitle {
  font-size: 0.85em;
  color: #666;
  letter-spacing: 0.2em;
  margin-bottom: 50px;
}
.pulse-ring {
  width: 200px; height: 200px;
  margin: 0 auto 50px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pulse-ring .ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(100,120,255,0.2);
  animation: pulse var(--speed) ease-out infinite;
}
.pulse-ring .ring:nth-child(1) { animation-delay: 0s; }
.pulse-ring .ring:nth-child(2) { animation-delay: 0.5s; }
.pulse-ring .ring:nth-child(3) { animation-delay: 1s; }
.pulse-ring .ring:nth-child(4) { animation-delay: 1.5s; }
@keyframes pulse {
  0% { width: 60px; height: 60px; opacity: 0.8; border-color: rgba(100,120,255,0.6); }
  100% { width: 200px; height: 200px; opacity: 0; border-color: rgba(100,120,255,0); }
}
.core {
  width: 40px; height: 40px;
  background: radial-gradient(circle, rgba(100,120,255,0.8), rgba(60,60,120,0.4));
  border-radius: 50%;
  box-shadow: 0 0 40px rgba(100,120,255,0.5);
  animation: breathe var(--speed) ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(100,120,255,0.5); }
  50% { transform: scale(1.3); box-shadow: 0 0 60px rgba(100,120,255,0.8); }
}
.freq-display { margin-bottom: 40px; }
.freq-value {
  font-size: 3.5em;
  font-weight: 100;
  color: #fff;
  letter-spacing: 0.1em;
  text-shadow: 0 0 20px rgba(100,120,255,0.5);
}
.freq-unit { font-size: 0.9em; color: #556; letter-spacing: 0.2em; margin-left: 5px; }
.wave-type { font-size: 0.8em; color: #445; margin-top: 8px; letter-spacing: 0.15em; }
.controls { display: flex; gap: 20px; justify-content: center; margin-bottom: 40px; }
.btn {
  background: none;
  border: 1px solid rgba(100,120,255,0.3);
  color: #889;
  padding: 12px 32px;
  font-size: 0.9em;
  letter-spacing: 0.15em;
  cursor: pointer;
  border-radius: 30px;
  transition: all 0.5s ease;
  font-family: inherit;
}
.btn:hover, .btn.active {
  border-color: rgba(100,120,255,0.8);
  color: #c8d0ff;
  box-shadow: 0 0 20px rgba(100,120,255,0.2);
}
.btn-play {
  border-color: rgba(100,200,255,0.5);
  color: #8ab8ff;
  min-width: 100px;
}
.btn-play.playing {
  border-color: rgba(255,100,100,0.5);
  color: #ff8a8a;
}
.slider-group { margin-bottom: 30px; text-align: left; }
.slider-label {
  display: flex; justify-content: space-between;
  font-size: 0.75em; color: #445; margin-bottom: 10px; letter-spacing: 0.1em;
}
.slider-label span:last-child { color: #667; }
input[type="range"] {
  width: 100%; height: 2px;
  background: rgba(100,120,255,0.15);
  outline: none; -webkit-appearance: none; border-radius: 1px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: rgba(100,120,255,0.6); border-radius: 50%;
  cursor: pointer; box-shadow: 0 0 10px rgba(100,120,255,0.4);
}
.modes { display: flex; gap: 12px; justify-content: center; margin-bottom: 35px; }
.mode-btn {
  background: rgba(100,120,255,0.05); border: 1px solid rgba(100,120,255,0.15);
  color: #556; padding: 8px 18px; font-size: 0.75em; cursor: pointer;
  border-radius: 20px; transition: all 0.3s ease; font-family: inherit; letter-spacing: 0.1em;
}
.mode-btn.active { border-color: rgba(100,120,255,0.6); color: #a0b0ff; background: rgba(100,120,255,0.1); }
.tip { font-size: 0.7em; color: #334; letter-spacing: 0.15em; margin-top: 20px; line-height: 1.8; }
.progress-bar { width: 100%; height: 1px; background: rgba(100,120,255,0.1); margin: 20px 0; position: relative; overflow: hidden; }
.progress-fill { height: 100%; background: rgba(100,120,255,0.4); width: 0%; transition: width 1s linear; }
.phase-indicator { font-size: 0.7em; color: #334; letter-spacing: 0.2em; margin-bottom: 20px; }
.phase-indicator .active-phase { color: #6678aa; }
/* 呼吸导引 */
.breath-guide {
  margin: 30px auto; padding: 20px;
  border: 1px solid rgba(100,120,255,0.1);
  border-radius: 12px; background: rgba(100,120,255,0.03);
  display: none;
}
.breath-guide.active { display: block; }
.breath-text { font-size: 1.1em; color: #8899cc; letter-spacing: 0.3em; min-height: 1.6em; transition: all 0.5s ease; }
.breath-hint { font-size: 0.7em; color: #445; margin-top: 8px; letter-spacing: 0.15em; }
.breath-visual {
  width: 80px; height: 80px; margin: 15px auto;
  border-radius: 50%; border: 2px solid rgba(100,120,255,0.3);
  display: flex; align-items: center; justify-content: center;
  transition: all 4s ease-in-out;
}
.breath-visual.inhale { width: 120px; height: 120px; border-color: rgba(100,180,255,0.6); box-shadow: 0 0 30px rgba(100,150,255,0.3); }
.breath-visual.exhale { width: 60px; height: 60px; border-color: rgba(100,120,255,0.2); box-shadow: none; }
.body-guide { position: relative; width: 30px; margin: 20px auto; height: 160px; }
.body-line { position: absolute; left: 50%; transform: translateX(-50%); width: 2px; height: 100%; background: rgba(100,120,255,0.15); border-radius: 1px; }
.breath-dot { position: absolute; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; background: rgba(100,180,255,0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(100,180,255,0.6); transition: top 4s ease-in-out; }
.body-label { position: absolute; right: -40px; font-size: 0.55em; color: #334; white-space: nowrap; letter-spacing: 0.1em; }
.body-label.top { top: 5%; }
.body-label.mid { top: 45%; }
.body-label.bot { top: 90%; }
.btn-breath { border-color: rgba(100,200,180,0.3); color: #88ccbb; }
.btn-breath.active { border-color: rgba(100,200,180,0.8); color: #aaffee; background: rgba(100,200,180,0.08); }
/* 状态指示 */
.status-indicator {
  font-size: 0.65em; color: #445; margin-top: 15px;
  letter-spacing: 0.1em; min-height: 1.2em;
}
.status-indicator.error { color: #ff6b6b; }
.status-indicator.ok { color: #6bff8a; }
</style>
</head>
<body>
<div id="stars"></div>
<div class="container">
  <h1>入 眠 频 率</h1>
  <div class="subtitle">HYPODNAMIC SLEEP THERAPY</div>
  <div class="pulse-ring" id="pulseRing">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="core"></div>
  </div>
  <div class="freq-display">
    <span class="freq-value" id="freqValue">4.0</span>
    <span class="freq-unit">Hz Theta</span>
    <div class="wave-type" id="waveType">双耳节拍 · Delta渐入</div>
  </div>
  <div class="phase-indicator">阶段: <span class="active-phase" id="phaseText">准备入睡</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="modes">
    <button class="mode-btn active" data-mode="theta" onclick="setMode('theta')">Theta放松</button>
    <button class="mode-btn" data-mode="delta" onclick="setMode('delta')">Delta深睡</button>
    <button class="mode-btn" data-mode="auto" onclick="setMode('auto')">自动渐入</button>
  </div>
  <button class="btn btn-breath" id="breathBtn" onclick="toggleBreathGuide()">🌬 呼吸导引</button>
  <div class="breath-guide" id="breathGuide">
    <div class="breath-visual" id="breathCircle"></div>
    <div class="body-guide">
      <div class="body-line"></div>
      <div class="breath-dot" id="breathDot" style="top: 5%"></div>
      <span class="body-label top">口/鼻</span>
      <span class="body-label mid">丹田</span>
      <span class="body-label bot">脚踵</span>
    </div>
    <div class="breath-text" id="breathText">一吸到踵，一呼出窍</div>
    <div class="breath-hint" id="breathHint">吸气4秒 → 屏息2秒 → 呼气6秒</div>
  </div>
  <div class="slider-group"><div class="slider-label"><span>基础频率</span><span id="baseFreqVal">400 Hz</span></div><input type="range" id="baseFreq" min="300" max="600" value="400" step="10" oninput="updateBaseFreq(this.value)"></div>
  <div class="slider-group"><div class="slider-label"><span>音量</span><span id="volumeVal">50%</span></div><input type="range" id="volume" min="0" max="100" value="50" step="5" oninput="updateVolume(this.value)"></div>
  <div class="slider-group" id="timerGroup"><div class="slider-label"><span>定时关闭</span><span id="timerVal">60 分钟</span></div><input type="range" id="timer" min="0" max="180" value="60" step="15" oninput="updateTimer(this.value)"></div>
  <div class="controls">
    <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶ 开始</button>
    <button class="btn" onclick="resetAll()">↺ 重置</button>
  </div>
  <div class="status-indicator" id="statusText"></div>
  <div class="tip">建议使用耳机 · 调暗灯光 · 深呼吸三次<br>频率将引导你从清醒 → 放松 → 深睡</div>
</div>
<script>
// ========== 音频引擎 ==========
class SleepTherapy {
  constructor() {
    this.ctx = null;
    this.isPlaying = false;
    this.baseFreq = 400;
    this.currentFreq = 4.0;
    this.targetFreq = 4.0;
    this.volume = 0.5;
    this.mode = 'auto';
    this.startTime = null;
    this.timerDuration = 60 * 60 * 1000;
    this.timerId = null;
    this.sources = [];
    this.gainNodes = [];
    this.lfo = null;
    this.animFrame = null;
    this.keepAliveInterval = null;
    this.lastResumeTime = 0;
  }

  setStatus(msg, type='') {
    const el = document.getElementById('statusText');
    if (el) {
      el.textContent = msg;
      el.className = 'status-indicator ' + type;
    }
  }

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.setStatus('AudioContext 已创建');
  }

  // 关键修复：使用周期性重建保持音频持续播放
  start() {
    if (!this.ctx) this.init();
    this.resumeAndStart();
  }

  async resumeAndStart() {
    if (!this.ctx) { this.init(); }
    
    // 尝试恢复 AudioContext
    if (this.ctx.state === 'suspended') {
      try {
        await this.ctx.resume();
        this.setStatus('AudioContext 已恢复', 'ok');
      } catch(e) {
        this.setStatus('恢复失败，请重新点击开始', 'error');
        console.error('Resume failed:', e);
        return;
      }
    }
    
    this.isPlaying = true;
    this.startTime = Date.now();
    this.recreateAudio();
    this.startLFO();
    this.startAnimation();
    this.startKeepAlive();
    if (this.timerDuration > 0) this.startTimer();
    this.setStatus('播放中...', 'ok');
  }

  stop() {
    this.isPlaying = false;
    this.stopAudio();
    if (this.timerId) clearTimeout(this.timerId);
    if (this.animFrame) cancelAnimationFrame(this.animFrame);
    if (this.keepAliveInterval) clearInterval(this.keepAliveInterval);
    this.setStatus('已停止');
  }

  recreateAudio() {
    this.stopAudio();
    
    const sampleRate = this.ctx.sampleRate;
    const duration = 4; // 4秒循环
    const buffer = this.ctx.createBuffer(2, sampleRate * duration, sampleRate);
    
    // 填充左声道(基础频率)和右声道(基础+差频)
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      const freq = ch === 0 ? this.baseFreq : this.baseFreq + this.currentFreq;
      for (let i = 0; i < data.length; i++) {
        data[i] = Math.sin(2 * Math.PI * freq * i / sampleRate) * 0.25;
      }
    }
    
    // 左声道源
    const srcL = this.ctx.createBufferSource();
    srcL.buffer = buffer;
    srcL.loop = true;
    const gainL = this.ctx.createGain();
    gainL.gain.value = this.volume * 0.4;
    const filterL = this.ctx.createBiquadFilter();
    filterL.type = 'lowpass';
    filterL.frequency.value = 1000;
    srcL.connect(filterL);
    filterL.connect(gainL);
    gainL.connect(this.ctx.destination);
    srcL.start();
    this.sources.push(srcL);
    this.gainNodes.push(gainL);
    
    // 右声道源
    const srcR = this.ctx.createBufferSource();
    srcR.buffer = buffer;
    srcR.loop = true;
    const gainR = this.ctx.createGain();
    gainR.gain.value = this.volume * 0.4;
    const filterR = this.ctx.createBiquadFilter();
    filterR.type = 'lowpass';
    filterR.frequency.value = 1000;
    srcR.connect(filterR);
    filterR.connect(gainR);
    gainR.connect(this.ctx.destination);
    srcR.start();
    this.sources.push(srcR);
    this.gainNodes.push(gainR);
    
    this.lastResumeTime = Date.now();
    this.setStatus('播放中...', 'ok');
  }

  // 关键：每10秒检查并重连，防止浏览器暂停
  startKeepAlive() {
    if (this.keepAliveInterval) clearInterval(this.keepAliveInterval);
    this.keepAliveInterval = setInterval(() => {
      if (!this.isPlaying) return;
      this.checkAndRestore();
    }, 10000);
  }

  async checkAndRestore() {
    if (!this.ctx || !this.isPlaying) return;
    const now = Date.now();
    // 如果距离上次恢复超过8秒，尝试重连
    if (now - this.lastResumeTime > 8000) {
      if (this.ctx.state === 'suspended') {
        try {
          await this.ctx.resume();
          this.recreateAudio();
          this.setStatus('后台播放恢复', 'ok');
        } catch(e) {
          this.setStatus('恢复失败', 'error');
        }
      }
    }
  }

  startLFO() {
    if (this.lfo) { try { this.lfo.stop(); } catch(e){} }
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.type = 'sine';
    lfo.frequency.value = 0.01;
    lfoGain.gain.value = 0.5;
    lfo.connect(lfoGain);
    // LFO连接到右声道增益节点
    if (this.gainNodes[1]) {
      lfoGain.connect(this.gainNodes[1].gain);
    }
    lfo.start();
    this.lfo = lfo;
  }

  startAnimation() {
    const step = () => {
      if (!this.isPlaying) return;
      this.updateFrequency();
      this.updatePhase();
      this.animFrame = requestAnimationFrame(step);
    };
    step();
  }

  updateFrequency() {
    const elapsed = Date.now() - this.startTime;
    let target;
    if (this.mode === 'theta') target = 6.0;
    else if (this.mode === 'delta') target = 2.0;
    else {
      if (elapsed < 5*60*1000) target = 6.0 - (elapsed/(5*60*1000))*2;
      else if (elapsed < 15*60*1000) target = 4.0 - ((elapsed-5*60*1000)/(10*60*1000))*2;
      else target = 2.0;
    }
    this.targetFreq = target;
    this.currentFreq += (target - this.currentFreq) * 0.001;
    // 更新差频
    if (this.gainNodes[1]) {
      // 通过改变buffer来更新频率（每4秒重建一次）
    }
    document.getElementById('freqValue').textContent = this.currentFreq.toFixed(1);
    document.getElementById('progressFill').style.width = Math.min(100, (elapsed/(30*60*1000))*100) + '%';
  }

  updatePhase() {
    const elapsed = Date.now() - this.startTime;
    const phaseText = document.getElementById('phaseText');
    const waveType = document.getElementById('waveType');
    if (elapsed < 5*60*1000) {
      phaseText.textContent = '准备入睡';
      waveType.textContent = '双耳节拍 · Theta波引导';
    } else if (elapsed < 15*60*1000) {
      phaseText.textContent = '浅睡过渡';
      waveType.textContent = '双耳节拍 · Theta→Delta过渡';
    } else if (elapsed < 30*60*1000) {
      phaseText.textContent = '进入深睡';
      waveType.textContent = '双耳节拍 · Delta深睡波';
    } else {
      phaseText.textContent = '深度睡眠';
      waveType.textContent = 'Delta波维持';
    }
  }

  setMode(mode) { this.mode = mode; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); document.querySelector(`[data-mode="${mode}"]`).classList.add('active'); }
  
  setBaseFreq(freq) {
    this.baseFreq = parseInt(freq);
    document.getElementById('baseFreqVal').textContent = freq + ' Hz';
    if (this.isPlaying) this.recreateAudio();
  }

  setVolume(vol) {
    this.volume = parseInt(vol) / 100;
    this.gainNodes.forEach(g => g.gain.value = this.volume * 0.4);
    document.getElementById('volumeVal').textContent = vol + '%';
  }

  setTimer(mins) { this.timerDuration = mins * 60 * 1000; document.getElementById('timerVal').textContent = mins + ' 分钟'; }

  stopAudio() {
    this.sources.forEach(s => { try { s.stop(); } catch(e){} });
    this.sources = [];
    this.gainNodes = [];
    if (this.lfo) { try { this.lfo.stop(); } catch(e){} this.lfo = null; }
  }

  startTimer() {
    if (this.timerId) clearTimeout(this.timerId);
    this.timerId = setTimeout(() => { this.fadeOut(); setTimeout(()=>this.stop(), 30000); }, this.timerDuration);
  }

  fadeOut() {
    const fade = () => {
      if (this.volume > 0.01 && this.isPlaying) {
        this.volume *= 0.98;
        this.gainNodes.forEach(g => g.gain.value = this.volume * 0.4);
        requestAnimationFrame(fade);
      }
    };
    fade();
  }

  reset() {
    this.stop();
    this.currentFreq = 4.0;
    this.startTime = null;
    document.getElementById('freqValue').textContent = '4.0';
    document.getElementById('phaseText').textContent = '准备入睡';
    document.getElementById('progressFill').style.width = '0%';
  }
}

const therapy = new SleepTherapy();
let isPlaying = false;

// ========== 页面可见性监听（关键修复） ==========
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && therapy.ctx && therapy.ctx.state === 'suspended') {
    try {
      await therapy.ctx.resume();
      therapy.recreateAudio();
      therapy.setStatus('页面可见，音频恢复', 'ok');
    } catch(e) {
      therapy.setStatus('恢复失败，请手动点击开始', 'error');
    }
  }
});

// 关键：pageshow 事件在页面从缓存恢复时触发
window.addEventListener('pageshow', async (e) => {
  if (e.persisted && therapy.ctx && therapy.ctx.state === 'suspended') {
    try {
      await therapy.ctx.resume();
      therapy.recreateAudio();
      therapy.setStatus('页面恢复，音频继续', 'ok');
    } catch(e) {
      therapy.setStatus('恢复失败', 'error');
    }
  }
});

// ========== 呼吸导引 ==========
class BreathGuide {
  constructor() { this.active = false; this.phase = 'inhale'; this.cycle = 0; }
  toggle() {
    this.active = !this.active;
    const guide = document.getElementById('breathGuide');
    const btn = document.getElementById('breathBtn');
    if (this.active) {
      guide.classList.add('active');
      btn.classList.add('active');
      btn.textContent = '🌬 呼吸导引 ✓';
      this.runInhale();
    } else {
      guide.classList.remove('active');
      btn.classList.remove('active');
      btn.textContent = '🌬 呼吸导引';
      this.stop();
    }
  }
  runInhale() {
    if (!this.active) return;
    this.cycle++;
    document.getElementById('breathCircle').className = 'breath-visual inhale';
    document.getElementById('breathDot').style.top = '90%';
    document.getElementById('breathText').textContent = '一吸到踵...';
    document.getElementById('breathHint').textContent = '吸气4秒 · 气沉丹田';
    setTimeout(()=>{ if(this.active) this.runHold(); }, 4000);
  }
  runHold() {
    if (!this.active) return;
    document.getElementById('breathText').textContent = '息住胎元...';
    document.getElementById('breathHint').textContent = '屏息2秒 · 神气相抱';
    setTimeout(()=>{ if(this.active) this.runExhale(); }, 2000);
  }
  runExhale() {
    if (!this.active) return;
    document.getElementById('breathCircle').className = 'breath-visual exhale';
    document.getElementById('breathDot').style.top = '5%';
    const phases = ['一呼出窍...','气贯周身...','神归丹田...','万念俱寂...'];
    document.getElementById('breathText').textContent = phases[(this.cycle-1)%phases.length];
    document.getElementById('breathHint').textContent = '呼气6秒 · 松静自然';
    setTimeout(()=>{ if(this.active) this.runInhale(); }, 6000);
  }
  stop() {
    document.getElementById('breathCircle').className = 'breath-visual';
    document.getElementById('breathDot').style.top = '50%';
    document.getElementById('breathText').textContent = '一吸到踵，一呼出窍';
    document.getElementById('breathHint').textContent = '吸气4秒 → 屏息2秒 → 呼气6秒';
  }
}
const breathGuide = new BreathGuide();

function togglePlay() {
  const btn = document.getElementById('playBtn');
  if (!isPlaying) {
    therapy.start();
    btn.textContent = '⏸ 暂停';
    btn.classList.add('playing');
    isPlaying = true;
    document.body.classList.add('sleeping');
  } else {
    therapy.stop();
    btn.textContent = '▶ 开始';
    btn.classList.remove('playing');
    isPlaying = false;
    document.body.classList.remove('sleeping');
  }
}
function resetAll() { therapy.reset(); document.getElementById('playBtn').textContent='▶ 开始'; document.getElementById('playBtn').classList.remove('playing'); isPlaying=false; document.body.classList.remove('sleeping'); }
function setMode(m) { therapy.setMode(m); }
function updateBaseFreq(v) { therapy.setBaseFreq(v); }
function updateVolume(v) { therapy.setVolume(v); }
function updateTimer(v) { therapy.setTimer(v); }
function toggleBreathGuide() { breathGuide.toggle(); }

function createStars() {
  const c = document.getElementById('stars');
  for (let i=0;i<100;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.setProperty('--dur',(2+Math.random()*4)+'s');
    s.style.setProperty('--max',(0.2+Math.random()*0.5).toString());
    s.style.animationDelay=Math.random()*4+'s';
    c.appendChild(s);
  }
}
createStars();
</script>
